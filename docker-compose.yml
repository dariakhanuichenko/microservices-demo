name: microservices-demo

services:
  zookeeper:
    image: bitnamilegacy/zookeeper:3.9.0
    container_name: zookeeper
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"

  kafka:
    image: bitnamilegacy/kafka:3.9.0
    container_name: kafka
    depends_on:
      # start order only - Kafka retries the Zookeeper connection itself.
      # A healthcheck here needs tools/4lw commands the image does not offer.
      - zookeeper
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_BROKER_ID: "1"
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners on purpose: services inside the compose network reach the
      # broker as kafka:29092, you from Windows reach it as localhost:9092.
      # A single advertised listener on localhost is why the services could
      # never connect from their containers.
      KAFKA_CFG_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # @RetryableTopic creates -retry / .dlq topics on the fly, so leave this on
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Creates the three business topics up front so the first message is not lost
  # to auto-creation latency. Runs once and exits.
  kafka-init:
    image: bitnamilegacy/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    # Creates the three business topics with 3 partitions each. The second call
    # bumps topics that were created earlier with a single partition; it fails
    # harmlessly once they already have 3, hence the "|| true".
    # One command per line on purpose - no backslash continuations to break.
    command:
      - |
        set -e
        for t in orders.created payments.completed inventory.reserved; do
          kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$t" --partitions 3 --replication-factor 1
          kafka-topics.sh --bootstrap-server kafka:29092 --alter --topic "$$t" --partitions 3 || true
        done
        kafka-topics.sh --bootstrap-server kafka:29092 --describe

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ordersdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-ordersdb}"]
      interval: 5s
      timeout: 5s
      retries: 20

  order-service:
    build:
      context: .
      args:
        SERVICE: order-service
    image: microservices-demo/order-service
    container_name: order-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ordersdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-appuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
    ports:
      - "8080:8080"

  payment-service:
    build:
      context: .
      args:
        SERVICE: payment-service
    image: microservices-demo/payment-service
    container_name: payment-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8081:8081"

  user-service:
    build:
      context: .
      args:
        SERVICE: user-service
    image: microservices-demo/user-service
    container_name: user-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8082:8082"

  inventory-service:
    build:
      context: .
      args:
        SERVICE: inventory-service
    image: microservices-demo/inventory-service
    container_name: inventory-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8083:8083"

volumes:
  postgres_data:
